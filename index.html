<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Ball in a Maze</title>
    <meta name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <link rel="stylesheet" href="./css/style.css">
  </head>

  <body>
    <div class="container">
      <h1>Ball in a Maze</h1>
      <div id="game-container"></div>
      
      <!-- Debug info (optional - can be hidden) -->
      <div id="debug-info" style="display: none;">
        <p>Beta (Y): <span id="beta">–</span></p>
        <p>Gamma (X): <span id="gamma">–</span></p>
      </div>
    </div>

    <!-- Load Phaser first -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser-arcade-physics.min.js"></script>
    <!-- Load sensor handling -->
    <script src="./js/sensor.js"></script>
    <!-- Load mouse controls -->
    <script src="./js/mouseControls.js"></script>
    <!-- Load game definitions -->
    <script src="./js/game.js"></script>
    <!-- Load config (references functions from game.js) -->
    <script src="./js/config.js"></script>
  </body>
</html>
