<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Ball in a Maze</title>
    <meta name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <link rel="stylesheet" href="./css/style.css">
  </head>

  <body>
    <div class="container">
      <h1>Ball in a Maze</h1>
      <p>Use your device's orientation or mouse to navigate the ball through the maze. Reach the green hole to win!</p>
      <p>Yellow walls increase bounce, red walls are deadly, purple walls increase speed.</p>
      <p>Use the arrow keys or your device to move some walls</p>     
      <div id="game-container"></div>
    </div>

    <!-- Phaser must load before game scripts that reference the Phaser global. -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser-arcade-physics.min.js"></script>
    <!-- Device orientation helpers (writes gyroX/gyroY/gyroZ used by game.js). -->
    <script src="./js/sensor.js"></script>
    <!-- Pointer tracking helpers (writes mouseX/mouseY used by game.js). -->
    <script src="./js/mouseControls.js"></script>
    <!-- Core scene lifecycle + gameplay logic. -->
    <script src="./js/game.js"></script>
    <!-- Bootstraps Phaser and references lifecycle functions from game.js. -->
    <script src="./js/config.js"></script>
  </body>
</html>
